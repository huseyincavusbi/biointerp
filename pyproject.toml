[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biointerp"
version = "0.1.0"
description = "Mechanistic interpretability experiments for protein language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Huseyin Cavus", email = "huseyincavus@proton.me" }]
keywords = ["protein-language-models", "interpretability", "error-neurons", "cett"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "transformers>=4.57",
    "huggingface-hub>=0.20",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
esm = ["esm>=3.4.1; python_version >= '3.12'"]
dnabert = ["einops", "triton; sys_platform == 'linux'"]
generative = ["multimolecule"]
evolution = ["metapredict"]
analysis = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/huseyincavusbi/biointerp"
Repository = "https://github.com/huseyincavusbi/biointerp"
Issues = "https://github.com/huseyincavusbi/biointerp/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4", "pre-commit>=4.0"]

[project.scripts]
biointerp = "biointerp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biointerp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: requires downloading a real model from the Hugging Face Hub (skipped by default)",
    "gpu: requires a CUDA/MPS accelerator (skipped by default)",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]
